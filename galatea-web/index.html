<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: el contenido llega bajo el notch y se compensa con env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Galatea</title>
    <meta name="description" content="Galatea: menú, reservas, pedidos desde la mesa y Experiencia Galatea." />

    <!-- PWA: al instalarla se abre en modo standalone, sin barras del navegador -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#040F1F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Galatea" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fotos del menú (Supabase Storage): la conexión segura se abre mientras carga la app.
         crossorigin porque las fotos se piden en modo CORS (ver components/Foto.tsx). -->
    <link rel="preconnect" href="https://tdsoqgiuyzwjeebkzyct.supabase.co" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700;800&family=Poiret+One&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/animated-logo.webm" as="video" type="video/webm" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
